[project]
name = "agentenv-hf"
version = "0.1.0"
description = "Publish AgentEnv bundles and their recorded runs to the Hugging Face Hub as datasets."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11"
keywords = ["agentenv", "huggingface", "datasets", "reinforcement-learning", "llm-agents", "rl-environment"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "agentenv-framework>=0.9.1293",
    "click>=8.1",
    "huggingface_hub>=1.31,<2",
    "pyarrow>=19",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.16,<0.17", "datasets>=5.1"]

[project.entry-points."agent_env.cli_plugins"]
hf = "agentenv_hf.cli:hf"

[project.urls]
Repository = "https://github.com/earakely-scale/agentenv-hf-plugin"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agentenv_hf"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "UP", "I"]
