name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - run: pip install 'ruff>=0.16,<0.17'
      - run: ruff check .

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
        framework: [pypi]
        include:
          # The plugin reads framework internals (the task-instance store, bundle parsing), so main is tested too.
          - python: "3.12"
            framework: main
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e '.[dev]'
      - if: matrix.framework == 'main'
        run: |
          pip install 'agentenv-framework-protocol @ git+https://github.com/scaleapi/agentenv-framework@main#subdirectory=packages/agentenv-protocol' \
              'agentenv-framework @ git+https://github.com/scaleapi/agentenv-framework@main'
      - run: pytest
      - run: agent-env plugin check
